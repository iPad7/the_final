name: CI

on:
  # 작업 브랜치는 pull_request가 처리한다. 모든 push에서도 돌리면 PR마다 두 번
  # 검사하게 된다.
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # 로컬과 같은 버전으로 고정해 lockfile을 동일하게 읽도록 한다.
        run: curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh

      - name: Install dependencies
        # --locked는 uv.lock이 pyproject.toml과 맞지 않으면 빌드를 실패시킨다.
        # 개발자가 쓰는 것과 다른 의존성을 조용히 해석하지 않게 한다.
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Import boundaries
        # 설계한 모듈 경계를 머지 전에 강제한다. 로컬에서만 돌리면 다음 사람이
        # 어긴 채로 머지된다.
        run: uv run lint-imports

      - name: Pytest
        # 통합 테스트를 포함한다. 러너가 Docker 데몬을 제공하며, Testcontainers가
        # 실제 PostgreSQL을 띄우는 데 필요하다(ADR23-07).
        run: uv run pytest

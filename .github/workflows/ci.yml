name: CI

on:
  # Feature branches are covered by pull_request; running on every push as well
  # would check each pull request twice.
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # Pinned to the version used locally so the lockfile is read identically.
        run: curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh

      - name: Install dependencies
        # --locked fails the build when uv.lock no longer matches pyproject.toml,
        # instead of silently resolving something else than developers run.
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        # Includes the integration tests: the runner provides a Docker daemon,
        # which Testcontainers needs for the real PostgreSQL (ADR23-07).
        run: uv run pytest
